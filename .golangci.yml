linters:
  enable-all: true
  disable:
    - gosmopolitan
    - nlreturn
    - nolintlint
    - tenv # The linter 'tenv' is deprecated (since v1.64.0) due to: Duplicate feature in another linter. Replaced by usetesting.
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl

issues:
#   exclude-files:
#     - example_test.go
  exclude-rules:
    - path: _test\.go
      linters:
        - depguard
        - dupword
        - errcheck
        - funlen
linters-settings:
#   cyclop:
#     skip-tests: true
  # lll:
  #   line-length: 250
